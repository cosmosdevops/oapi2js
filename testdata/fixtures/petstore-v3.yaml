openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
paths: {}
components:
  schemas:
    Tag:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
    Pet:
      type: object
      required: [name]
      description: >
        A pet in the store,
        written as a folded block.
      properties:
        name: {type: string}
        tag:
          $ref: '#/components/schemas/Tag'
          description: The pet's main tag.
        nickname: &nick
          type: string
          maxLength: 20
        alias: *nick
        vaccinated: {type: boolean, default: yes}
        legacyFlag: {type: boolean, default: off}
        mode: {type: integer, default: 0755}
        mask: {type: integer, default: 0x1F}
        duration: {type: integer, default: 1:30}
        ratio: {type: number, default: 1.5e+3}
        notANumber: {type: string, default: 1e3}
        version: {type: string, example: 1.10}
        quoted: {type: string, default: '0755'}
        tilde: {default: ~}
        price: {type: number, multipleOf: 0.01, maximum: .inf}
    Base: &base
      type: object
      description: base
      properties:
        id: {type: string}
    Derived:
      <<: *base
      description: merged from Base
    Order:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            quantity: {type: integer, minimum: 1}
    Forward:
      type: object
      properties:
        later:
          $ref: '#/components/schemas/Zed'
    Zed:
      type: object
      properties:
        z: {type: string}
    Shelter:
      type: object
      properties:
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        byName:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Pet'
